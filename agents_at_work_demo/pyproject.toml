[project]
name = "agents_at_work_demo"
version = "0.1.0"
description = "agents-at-work-demo using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "apscheduler>=3.11.2",
    "crewai-tools[mcp]>=1.9.3",
    "crewai[tools]==1.9.3",
    "email-validator>=2.3.0",
    "fastapi>=0.128.2",
    "fastapi-sso>=0.20.0",
    "litellm[proxify]>=1.75.3",
    "ollama>=0.6.1",
]

[project.scripts]
agents_at_work_demo = "agents_at_work_demo.main:run"
run_crew = "agents_at_work_demo.main:run"
train = "agents_at_work_demo.main:train"
replay = "agents_at_work_demo.main:replay"
test = "agents_at_work_demo.main:test"
run_with_trigger = "agents_at_work_demo.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
